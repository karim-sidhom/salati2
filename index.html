<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مواقيت الصلاة والمساجد - SALATI.ONLINE</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b1e1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="مواقيت">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" rel="stylesheet">
    <style>
        :root {
            --bg:        #0b1e1a;
            --card:      #0e2820;
            --deep:      #081612;
            --gold:      #d4a017;
            --gold-dim:  rgba(212,160,23,0.15);
            --teal:      #13b4a0;
            --teal-dim:  rgba(19,180,160,0.12);
            --muted:     #7a9e96;
            --text:      #e8f4f1;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(19,180,160,0.08) 0%, transparent 70%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 24px 16px;
        }
        .app { width: 100%; max-width: 460px; animation: fadeUp 0.7s ease both; }
        @keyframes fadeUp { from { opacity:0; transform: translateY(24px); } to { opacity:1; transform: translateY(0); } }
        .header { text-align: center; margin-bottom: 20px; position: relative; }
        .header::after { content: ''; display: block; width: 60px; height: 2px; background: linear-gradient(90deg, transparent, var(--gold), transparent); margin: 12px auto 0; }
        .waqf-label { font-size: 11px; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 6px; font-weight: 700; }
        .app-title { font-family: 'Amiri', serif; font-size: 28px; color: var(--teal); font-weight: 700; line-height: 1.2; }
        .hijri { font-size: 12px; color: var(--muted); margin-top: 6px; }
        .sync-dot { display: inline-block; width: 7px; height: 7px; background: var(--teal); border-radius: 50%; margin-left: 5px; animation: pulse 2s infinite; vertical-align: middle; }
        @keyframes pulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:.4; transform:scale(1.4); } }
        
        .settings-box { margin-bottom: 18px; }
        .settings-title { font-size:13px; color:#d4a017; font-weight:700; margin-bottom:10px; }
        .setting-input { background: var(--card); color: var(--text); border: 1px solid rgba(212,160,23,0.25); padding: 10px 12px; border-radius: 10px; font-family: 'Cairo', sans-serif; font-size: 13px; width: 100%; outline: none; transition: border-color 0.2s; margin-bottom: 10px; }
        .setting-input:focus { border-color: var(--teal); }
        .setting-input::placeholder { color: var(--muted); }
        .save-btn { background: var(--card); color: var(--text); border: 1px solid rgba(212,160,23,0.25); padding: 10px 12px; border-radius: 10px; font-family: 'Cairo', sans-serif; font-size: 13px; width: 100%; outline: none; transition: border-color 0.2s; cursor: pointer; font-weight: 700; }
        .save-btn:hover { border-color: var(--teal); }

        .method-selector-wrap { margin-bottom: 18px; text-align: center; }
        .method-select { background: var(--card); color: var(--text); border: 1px solid rgba(212,160,23,0.25); padding: 8px 12px; border-radius: 10px; font-family: 'Cairo', sans-serif; font-size: 12px; width: 100%; outline: none; transition: border-color 0.2s; }
        .method-select:focus { border-color: var(--teal); }
        
        .countdown-wrap { background: var(--deep); border: 1px solid rgba(212,160,23,0.18); border-radius: 18px; padding: 20px; text-align: center; margin-bottom: 20px; position: relative; overflow: hidden; }
        .countdown-wrap::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse 60% 80% at 50% 100%, rgba(212,160,23,0.06), transparent); pointer-events: none; }
        .cd-label { font-size: 11px; color: var(--muted); margin-bottom: 6px; letter-spacing:0.05em; }
        .cd-prayer-name { font-family:'Amiri',serif; font-size:16px; color:var(--gold); margin-bottom: 4px; font-weight: 700; }
        .cd-timer { font-size: 42px; font-weight: 700; color: var(--gold); letter-spacing: 4px; font-variant-numeric: tabular-nums; text-shadow: 0 0 20px rgba(212,160,23,0.3); }
        
        .prayer-grid { display: grid; grid-template-columns: repeat(5,1fr); gap: 8px; margin-bottom: 22px; }
        .p-item { background: var(--card); border-radius: 12px; padding: 12px 4px; text-align: center; border: 1px solid rgba(255,255,255,0.03); transition: border-color .3s; }
        .p-item.active { border-color: var(--gold); background: linear-gradient(160deg, rgba(212,160,23,0.08), transparent); box-shadow: 0 0 14px rgba(212,160,23,0.12); }
        .p-name { font-size: 11px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
        .p-time { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
        .p-item.active .p-time { color: var(--gold); }
        
        .footer { text-align: center; font-size: 9px; letter-spacing: 2px; color: rgba(255,255,255,0.15); text-transform: uppercase; padding: 20px 0 10px; }
        
        .video-modal { display:none; position:fixed; inset:0; background:#000; z-index:9999; justify-content:center; align-items:center; flex-direction:column; padding:20px; }
        .video-modal.active { display:flex; }
        .video-container { width:100%; max-width:100%; aspect-ratio:16/9; background:#000; border-radius:15px; overflow:hidden; margin-bottom:20px; }
        .video-container iframe { width:100%; height:100%; }
        .close-btn { background:#e8445a; color:white; border:none; padding:12px 30px; border-radius:25px; font-size:16px; font-weight:700; cursor:pointer; width:100%; max-width:300px; }
        .close-btn:hover { background:#c0203a; }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <div class="waqf-label">وقف خيري لروح جدي العزيز الحاج حمودة سيدهم</div>
        <div class="app-title">مواقيت الصلاة العالمية</div>
        <div class="hijri" id="hijri-date">-- --- ---- هـ</div>
        <div style="margin-top:8px;font-size:11px;color:var(--teal)">
            <span class="sync-dot"></span> رصد الموقع ذكي وجغرافي بالـ GPS
        </div>
    </div>

    <div class="settings-box" style="display:none;">
        <div class="settings-title">⚙️ إعدادات (اختياري)</div>
        <input type="url" id="video-url-input" class="setting-input" placeholder="أدخل رابط فيديو YouTube (اختياري)" dir="ltr">
        <input type="url" id="adhan-url-input" class="setting-input" placeholder="أدخل رابط Adhan (اختياري)" dir="ltr">
        <button onclick="savePrayerSettings()" class="save-btn">✓ تحديث الروابط</button>
    </div>

    <div class="method-selector-wrap">
        <select id="method-select" class="method-select">
            <option value="tunisia" selected="">تونس والمغرب العربي (فجر 18°، عشاء 17°)</option>
            <option value="mwl">رابطة العالم الإسلامي (فجر 18°، عشاء 17°)</option>
            <option value="egypt">الهيئة المصرية العامة (فجر 19.5°، عشاء 17.5°)</option>
            <option value="makkah">أم القرى - مكة المكرمة (فجر 18.5°، عشاء +90 دقيقة)</option>
        </select>
    </div>

    <div class="countdown-wrap">
        <div class="cd-label">الوقت المتبقي للصلاة القادمة</div>
        <div class="cd-prayer-name" id="next-prayer-name">--</div>
        <div class="cd-timer" id="cd-timer">00:00:00</div>
        <button onclick="triggerPrayerTime('الأذان')" style="margin-top:15px; background: var(--teal-dim); color: var(--teal); border: 1px solid rgba(19,180,160,0.3); padding: 10px 20px; border-radius: 10px; font-family: 'Cairo', sans-serif; font-weight: 700; cursor: pointer; transition: all 0.3s; font-size: 14px;">🔊 الأذان</button>
    </div>

    <div class="prayer-grid" id="prayer-grid"></div>

    <div class="footer">SALATI.ONLINE · مواقيت الصلاة والمساجد · مع الفيديو والأذان</div>
</div>

<!-- VIDEO MODAL -->
<div class="video-modal" id="video-modal">
    <div class="video-container">
        <iframe id="prayer-video" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe>
    </div>
    <button class="close-btn" onclick="closeVideo()">إغلاق الفيديو</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
<script>
const d2r = d => d * Math.PI / 180;
const r2d = r => r * 180 / Math.PI;
const fixHour  = h => h - 24 * Math.floor(h / 24);
const fixAngle = a => a - 360 * Math.floor(a / 360);

let currentLat = null;
let currentLng = null;
let countdownInterval = null;
let gpsWatchId = null;
let updateTimesInterval = null;

let prayerVideoConfig = {
    videoUrl: localStorage.getItem('prayerVideoUrl') || 'https://youtu.be/3paZoyU-1aE',
    adhanUrl: localStorage.getItem('prayerAdhanUrl') || 'https://archive.org/download/adhan_20161120/adhan.mp3',
};

let lastPrayerPlayed = null;
let prayerCheckInterval = null;
let adhanAudio = null;

function savePrayerSettings() {
    prayerVideoConfig.videoUrl = document.getElementById('video-url-input').value;
    prayerVideoConfig.adhanUrl = document.getElementById('adhan-url-input').value;
    
    localStorage.setItem('prayerVideoUrl', prayerVideoConfig.videoUrl);
    localStorage.setItem('prayerAdhanUrl', prayerVideoConfig.adhanUrl);
    
    Toastify({
        text: '✓ تم حفظ إعدادات الفيديو والأذان',
        duration: 3000,
        gravity: 'bottom',
        position: 'right',
        style: { background: 'rgba(19,180,160,0.92)', color: '#fff', border: '1px solid #13b4a0', borderRadius: '10px', fontFamily: "'Cairo', sans-serif", fontSize: '13px', fontWeight: '600' }
    }).showToast();
}

function extractYouTubeId(url) {
    let videoId = '';
    if (url.includes('youtu.be')) {
        videoId = url.split('youtu.be/')[1]?.split('?')[0] || '';
    } else if (url.includes('youtube.com')) {
        videoId = url.split('v=')[1]?.split('&')[0] || '';
    }
    return videoId;
}

function playAdhan() {
    if (!prayerVideoConfig.adhanUrl) return;
    if (adhanAudio) adhanAudio.pause();
    adhanAudio = new Audio(prayerVideoConfig.adhanUrl);
    adhanAudio.play().catch(e => console.log('خطأ في تشغيل الأذان'));
}

function playPrayerVideo() {
    if (!prayerVideoConfig.videoUrl) return;
    const modal = document.getElementById('video-modal');
    const videoId = extractYouTubeId(prayerVideoConfig.videoUrl);
    
    if (videoId) {
        document.getElementById('prayer-video').src = `https://www.youtube.com/embed/${videoId}?autoplay=1&fs=1`;
    } else {
        document.getElementById('prayer-video').src = prayerVideoConfig.videoUrl;
    }
    
    modal.classList.add('active');
    
    if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(e => {});
    }
}

function closeVideo() {
    const modal = document.getElementById('video-modal');
    modal.classList.remove('active');
    if (document.fullscreenElement) {
        document.exitFullscreen().catch(e => {});
    }
}

function triggerPrayerTime(prayerName) {
    console.log('🕌 حان وقت الصلاة:', prayerName);
    playAdhan();
    setTimeout(() => playPrayerVideo(), 1000);
}

function checkPrayerTime() {
    if (!currentLat || !currentLng) return;
    
    const tz = -new Date().getTimezoneOffset() / 60;
    const now = new Date();
    const nowH = now.getHours() + now.getMinutes() / 60 + now.getSeconds() / 3600;
    const nowMin = now.getHours() * 60 + now.getMinutes();
    
    const method = document.getElementById('method-select').value;
    const prayers = computePrayers(currentLat, currentLng, tz, method, now);
    
    prayers.forEach(prayer => {
        if (prayer.time !== null) {
            const prayerTimeMin = Math.floor(fixHour(prayer.time) * 60);
            
            if (prayerTimeMin === nowMin && lastPrayerPlayed !== prayer.name + nowMin) {
                triggerPrayerTime(prayer.name);
                lastPrayerPlayed = prayer.name + nowMin;
                setTimeout(() => { lastPrayerPlayed = null; }, 65000);
            }
        }
    });
}

function getHijriDate() {
    try { return new Intl.DateTimeFormat('ar-SA-u-ca-islamic', {day:'numeric',month:'long',year:'numeric'}).format(new Date()); }
    catch(e) { return ''; }
}

function sunPosition(jd) {
    const D = jd - 2451545.0;
    const g = fixAngle(357.529 + 0.98560028 * D);
    const q = fixAngle(280.459 + 0.98564736 * D);
    const L = fixAngle(q + 1.915 * Math.sin(d2r(g)) + 0.020 * Math.sin(d2r(2*g)));
    const e = 23.439 - 0.00000036 * D;
    const RA = r2d(Math.atan2(Math.cos(d2r(e)) * Math.sin(d2r(L)), Math.cos(d2r(L)))) / 15;
    const dec = r2d(Math.asin(Math.sin(d2r(e)) * Math.sin(d2r(L))));
    const EqT = q/15 - fixHour(RA);
    return { dec, EqT };
}

function julianDate(y, m, d) {
    if (m <= 2) { y--; m += 12; }
    const A = Math.floor(y/100);
    const B = 2 - A + Math.floor(A/4);
    return Math.floor(365.25*(y+4716)) + Math.floor(30.6001*(m+1)) + d + B - 1524.5;
}

function computePrayers(lat, lng, timezone, method, date = new Date()) {
    const y = date.getFullYear(), m = date.getMonth()+1, d = date.getDate();
    const jd = julianDate(y, m, d);
    const { dec, EqT } = sunPosition(jd);
    const Dhuhr = 12 + timezone - lng/15 - EqT;
    
    function hourAngle(alpha, direction) {
        const latRad = d2r(lat);
        const decRad = d2r(dec);
        const cosH = (Math.sin(d2r(alpha)) - Math.sin(latRad) * Math.sin(decRad)) / (Math.cos(latRad) * Math.cos(decRad));
        if (cosH > 1 || cosH < -1) return null;
        const h = r2d(Math.acos(cosH)) / 15;
        return direction === 'rise' ? Dhuhr - h : Dhuhr + h;
    }

    let fajrAngle = -18, ishaAngle = -17, ishaMinutesAfterMaghrib = null;
    if (method === 'egypt') { fajrAngle = -19.5; ishaAngle = -17.5; }
    else if (method === 'makkah') { fajrAngle = -18.5; ishaMinutesAfterMaghrib = 90; }

    const FajrTime = hourAngle(fajrAngle, 'rise');
    const asrAngle = r2d(Math.atan(1 / (1 + Math.tan(d2r(Math.abs(lat - dec))))));
    const AsrTime = hourAngle(asrAngle, 'set');
    const MaghribTime = hourAngle(-0.8333, 'set');
    
    let IshaTime = null;
    if (ishaMinutesAfterMaghrib !== null) {
        if (MaghribTime !== null) IshaTime = MaghribTime + (ishaMinutesAfterMaghrib / 60);
    } else {
        IshaTime = hourAngle(ishaAngle, 'set');
    }

    const fmt = h => { 
        if (h === null || isNaN(h)) return '--:--'; 
        h = fixHour(h); 
        const mTotal = Math.round((h - Math.floor(h)) * 60);
        let hr = Math.floor(h), mn = mTotal;
        if (mn === 60) { mn = 0; hr = (hr + 1) % 24; }
        return String(hr).padStart(2,'0') + ':' + String(mn).padStart(2,'0'); 
    };

    return [
        { name:'الفجر',  time: FajrTime, fmt: fmt(FajrTime) },
        { name:'الظهر',  time: Dhuhr,    fmt: fmt(Dhuhr) },
        { name:'العصر',  time: AsrTime,  fmt: fmt(AsrTime) },
        { name:'المغرب', time: MaghribTime, fmt: fmt(MaghribTime) },
        { name:'العشاء', time: IshaTime, fmt: fmt(IshaTime) },
    ];
}

function renderPrayers(prayers, nowH) {
    const grid = document.getElementById('prayer-grid');
    grid.innerHTML = '';
    let nextIdx = -1;
    for (let i = 0; i < prayers.length; i++) {
        if (prayers[i].time !== null && fixHour(prayers[i].time) > nowH) { nextIdx = i; break; }
    }
    if (nextIdx === -1) nextIdx = 0;
    
    prayers.forEach((p, i) => {
        const div = document.createElement('div');
        div.className = 'p-item' + (i === nextIdx ? ' active' : '');
        div.innerHTML = `<div class="p-name">${p.name}</div><div class="p-time">${p.fmt}</div>`;
        grid.appendChild(div);
    });
    return nextIdx;
}

function startCountdown(prayers) {
    if (countdownInterval) clearInterval(countdownInterval);
    const timer = document.getElementById('cd-timer');
    const nameEl = document.getElementById('next-prayer-name');
    
    function tick() {
        const now = new Date();
        const nowH = now.getHours() + now.getMinutes()/60 + now.getSeconds()/3600;
        let idx = -1;
        for (let i = 0; i < prayers.length; i++) {
            if (prayers[i].time !== null && fixHour(prayers[i].time) > nowH) { idx = i; break; }
        }
        
        let isNextDay = false;
        if (idx === -1) { idx = 0; isNextDay = true; }
        
        const next = prayers[idx];
        if (!next || next.time === null) { timer.textContent = '--:--:--'; return; }
        nameEl.textContent = next.name + (isNextDay ? ' (غداً)' : '');
        
        let diffHours = fixHour(next.time) - nowH;
        if (isNextDay) diffHours = (24 - nowH) + fixHour(next.time);
        
        const totalSec = Math.max(0, Math.floor(diffHours * 3600));
        const hrs = Math.floor(totalSec / 3600);
        const mins = Math.floor((totalSec % 3600) / 60);
        const secs = totalSec % 60;
        
        timer.textContent = String(hrs).padStart(2,'0') + ':' + String(mins).padStart(2,'0') + ':' + String(secs).padStart(2,'0');
    }
    tick();
    countdownInterval = setInterval(tick, 1000);
}

function initApp(lat, lng) {
    currentLat = lat;
    currentLng = lng;
    
    const select = document.getElementById('method-select');
    const updateTimes = () => {
        const tz = -new Date().getTimezoneOffset()/60;
        const now = new Date();
        const nowH = now.getHours() + now.getMinutes()/60 + now.getSeconds()/3600;
        const prayers = computePrayers(currentLat, currentLng, tz, select.value, now);
        renderPrayers(prayers, nowH);
        startCountdown(prayers);
    };
    
    select.onchange = updateTimes;
    updateTimes();
    if (updateTimesInterval) clearInterval(updateTimesInterval);
    updateTimesInterval = setInterval(updateTimes, 60000);
    
    checkPrayerTime();
}

window.onload = function() {
    document.getElementById('hijri-date').innerText = getHijriDate();
    document.getElementById('video-url-input').value = prayerVideoConfig.videoUrl;
    document.getElementById('adhan-url-input').value = prayerVideoConfig.adhanUrl;
    
    if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
    }

    if (!navigator.geolocation) {
        alert('⚠️ المتصفح لا يدعم تحديد الموقع');
        return;
    }

    let initialized = false;
    gpsWatchId = navigator.geolocation.watchPosition(pos => {
        const coords = pos.coords;
        const lat = coords.latitude;
        const lng = coords.longitude;
        
        initApp(lat, lng);
        initialized = true;
    }, err => {
        console.error('خطأ GPS:', err);
    }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });

    if (!prayerCheckInterval) {
        prayerCheckInterval = setInterval(checkPrayerTime, 60000);
    }
};
</script>
</body>
</html>
